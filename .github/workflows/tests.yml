name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: viralorthology
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run tests
        shell: bash -l {0}
        run: ./run_tests.sh
